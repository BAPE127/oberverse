<!doctype html><meta charset="utf-8"><body style="margin:0;background:#07061a"><canvas id="c" width="2880" height="1950"></canvas>
<script type="module">
import { generate, build, render } from './g_gen.js';
import { BIOMES } from './g_gen.js';

txt('GENERATED MISSION MAPS: one recipe per mission, one palette per biome, one architecture per country (target art)', 30, 44, 30, '#ffe28a', 800);

  ['compound', 'temperate', 'ostmark', 'COMPOUND RAID · temperate', 'a country estate used as a base'], ['compound', 'snow', 'sund', 'COMPOUND RAID · snow', 'a northern outpost'], ['forest', 'temperate', 'ostmark', 'FOREST · temperate', 'trails, stream, a logging camp'], ['forest', 'snow', 'sund', 'FOREST · taiga', 'pines, snow, a hunting lodge'], ['forest', 'mud', 'varn', 'FOREST · jungle', 'dense, humid, dark undergrowth'],
