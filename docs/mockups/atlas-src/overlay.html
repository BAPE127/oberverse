<!doctype html><meta charset="utf-8"><title>Oberverse atlas overlay (proposal)</title>
<style>html,body{margin:0;background:#07101c}canvas{display:block}</style><body><canvas id="c"></canvas>
<script src="atlas-out.js"></script><script src="extras.js"></script><script src="theatres.js"></script>
<script>
const q = new URLSearchParams(location.search); const name = q.get('name');
const lab = q.get('labels') || 'auto'; // none | auto
const sc = document.createElement('script'); sc.src = 'base/' + name + '.meta.js'; sc.onload = () => { const img = new Image(); img.onload = () => draw(window.META, img); img.src = 'base/' + name + '.png'; }; document.head.appendChild(sc);
function draw(M, img) {
  const A = ATLAS, X = EXTRAS; const { la0, la1, lo0, lo1, ppd, W, H } = M;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
  const px = (lon) => (lon - lo0) * ppd, py = (lat) => (la1 - lat) * ppd;
  const inb = (la, lo, m = 0) => la >= la0 - m && la <= la1 + m && lo >= lo0 - m && lo <= lo1 + m;
  const big = ppd >= 15, huge = ppd >= 28, world = ppd < 14;
  const hexA = (h, a) => h + Math.round(a * 255).toString(16).padStart(2, '0');
  // rivers
  g.lineCap = 'round'; g.strokeStyle = 'rgba(110,190,230,.7)';
  for (const [a, b, c, d, n] of X.rivers) { if (!inb(a, b, 1) && !inb(c, d, 1)) continue; g.lineWidth = Math.min(ppd / 9, Math.max(world ? 0.5 : 0.9, Math.sqrt(n) * ppd / 130)); g.beginPath(); g.moveTo(px(b), py(a)); g.lineTo(px(d), py(c)); g.stroke(); }
  // roads
  if (!world) for (const r of X.roads) { if (!inb(r.a[0], r.a[1], 2) && !inb(r.b[0], r.b[1], 2)) continue; g.setLineDash(r.kind === 'main' ? [] : [5, 4]); g.strokeStyle = r.kind === 'main' ? 'rgba(255,225,140,.9)' : 'rgba(255,255,255,.55)'; g.lineWidth = r.kind === 'main' ? Math.max(1.4, ppd / 18) : Math.max(1, ppd / 28); g.beginPath(); g.moveTo(px(r.a[1]), py(r.a[0])); g.lineTo(px(r.b[1]), py(r.b[0])); g.stroke(); } g.setLineDash([]);
  // villages
  if (big) { g.fillStyle = 'rgba(255,248,225,.7)'; for (const [la, lo] of X.villages) { if (!inb(la, lo)) continue; g.fillRect(px(lo) - 1, py(la) - 1, 2.4, 2.4); } }
  // markers
  const placed = []; const fits = (r) => !placed.some((p) => r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y) && r.x > 2 && r.y > 2 && r.x + r.w < W - 2 && r.y + r.h < H - 2;
  function star(x, y, r) { g.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); g.stroke(); }
  const msize = world ? 0.7 : big ? 1.25 : 1; 
  A.mil.forEach((m) => { if (!inb(m.lat, m.lon)) return; const x = px(m.lon), y = py(m.lat), r = 5.5 * msize; g.fillStyle = '#ff6a5a'; g.strokeStyle = '#1a0500'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill(); g.stroke(); placed.push({ x: x - 7, y: y - 7, w: 14, h: 14 }); });
  A.places.forEach((p) => { if (!inb(p.lat, p.lon)) return; const x = px(p.lon), y = py(p.lat); g.strokeStyle = '#05101a'; g.lineWidth = 1.5;
    if (p.k === 'c') { g.fillStyle = '#ffd24a'; g.lineWidth = 2; star(x, y, (world ? 6 : 10) * (big ? 1.2 : 1)); }
    else { g.fillStyle = p.k === 'p' ? '#7fe8ff' : p.k === 'm' ? '#e0b04a' : p.k === 'f' ? '#ff9a5a' : p.k === 'r' ? '#c58aff' : p.k === 'b' ? '#ff6a5a' : '#ffffff'; const r = (p.k === 't' ? 3 : 3.6) * msize; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke(); }
    placed.push({ x: x - 5, y: y - 5, w: 10, h: 10 }); });
  // text: thin and quiet; checks for collisions and gives way
  function text(t, cx, cy, size, o = {}) { g.font = `${o.weight || 600} ${size}px "Segoe UI", system-ui, sans-serif`; if (o.spacing) g.letterSpacing = o.spacing + 'px'; const w = g.measureText(t).width, h = size; g.letterSpacing = '0px';
    for (const [tx, ty] of o.tries || [[0, 0]]) { const x = cx - w / 2 + tx * (w / 2 + 7), y = cy - h / 2 + ty * (h + 3); const r = { x: x - 2, y: y - 1, w: w + 4, h: h + 2 }; if (!o.force && !fits(r)) continue; placed.push(r); g.save(); g.textBaseline = 'top'; if (o.spacing) g.letterSpacing = o.spacing + 'px'; g.lineJoin = 'round'; g.globalAlpha = o.alpha ?? 1; g.lineWidth = o.halo ?? 2.4; g.strokeStyle = o.haloColor || 'rgba(4,10,18,.75)'; g.strokeText(t, x, y); g.fillStyle = o.color || '#fff'; g.fillText(t, x, y); g.restore(); return true; } return false; }
  if (lab !== 'none') {
    // country names (spread out, translucent)
    const AT = { sund: [63.5, -9], ostmark: [55.5, 15], varn: [40.5, 51], teshvar: [30, 91], caldera: [-3, 31], pallas: [11.5, -34], morrow: [-33.5, 147], lirre: [46.5, -77], westreach: [38.5, -140], sunmouth: [9.5, -116], dunmere: [24.5, -6.5] };
    const cs = world ? 16 : Math.min(40, Math.max(18, ppd * 0.75));
    for (const [id, c] of Object.entries(A.countries)) { const at = AT[id]; if (!at || !inb(at[0], at[1])) continue; text(c.name.toUpperCase(), px(at[1]), py(at[0]), cs, { force: true, weight: 800, spacing: Math.max(2, cs / 5), alpha: 0.62, halo: Math.max(2, cs / 10), haloColor: 'rgba(4,10,18,.4)' }); }
    // states: only when zoomed, small caps, quiet
    if (big) A.states.forEach((s) => { if (!inb(s.lat, s.lon)) return; const free = s.country === 'free'; text(s.name.toUpperCase(), px(s.lon), py(s.lat) + (huge ? 22 : 14), huge ? 13 : 11.5, { weight: 700, spacing: 1.4, alpha: 0.72, color: free ? '#dfe4ee' : '#fff', halo: 2.2 }); });
    // places: capitals always; ports/bases/forts/industry at mid zoom; towns at high zoom
    const rank = { c: 0, p: 1, b: 1, f: 2, m: 2, r: 2, t: 3 };
    const limit = world ? 0 : huge ? 3 : big ? 2 : 0;
    A.places.slice().sort((a, b) => rank[a.k] - rank[b.k]).forEach((p) => { if (!inb(p.lat, p.lon)) return; if (rank[p.k] > limit) return; const cap = p.k === 'c'; text(p.name, px(p.lon), py(p.lat) + 12 + (cap ? 4 : 0), cap ? (huge ? 17 : 14) : huge ? 12.5 : 11, { weight: cap ? 800 : 500, color: cap ? '#ffe28a' : '#e6f3fa', halo: 2.4, tries: [[0, 1], [1, 0.1], [-1, 0.1], [0, -1.2]] }); });
    A.mil.forEach((m) => { if (!inb(m.lat, m.lon) || !huge) return; text(m.name, px(m.lon), py(m.lat) - 15, 11, { weight: 600, color: '#ffb0a6', tries: [[0, 0], [1, 0], [-1, 0], [0, -1.3]] }); });
  }
  // theatres (only in theatre mode)
  if (M.mode === 'theatres') { const cols = ['#ff6a5a', '#4ab4ff', '#ffb04a', '#c58aff', '#5fe08a', '#ffe14a', '#cfcfcf']; THEATRES_.forEach((t, n) => { const ss = A.states.filter((s) => t.states.includes(s.id)); const lat = ss.reduce((a, s) => a + s.lat, 0) / ss.length, lon = ss.reduce((a, s) => a + s.lon, 0) / ss.length; const x = px(lon), y = py(lat); g.fillStyle = cols[n % 7]; g.strokeStyle = '#05101a'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#05101a'; g.font = '800 16px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n + 1), x, y + 1); g.textAlign = 'start'; });
    // legend
    g.fillStyle = 'rgba(5,12,22,.88)'; g.fillRect(16, H - 28 - THEATRES_.length * 26, 560, 20 + THEATRES_.length * 26); g.textBaseline = 'middle'; g.font = '600 15px system-ui'; THEATRES_.forEach((t, n) => { const y = H - 28 - THEATRES_.length * 26 + 22 + n * 26; g.fillStyle = cols[n % 7]; g.beginPath(); g.arc(36, y, 9, 0, 7); g.fill(); g.fillStyle = '#05101a'; g.font = '800 12px system-ui'; g.textAlign = 'center'; g.fillText(String(n + 1), 36, y + 1); g.textAlign = 'start'; g.fillStyle = '#eaf2f8'; g.font = '600 14px system-ui'; g.fillText(`${t.name} — ${t.kind}`, 54, y); }); }
  if (q.get('legend') === '1') { const LW = 1060, LH = 112, x0 = 16, y0 = H - LH - 16; g.fillStyle = 'rgba(5,12,22,.9)'; g.strokeStyle = '#2a4a6a'; g.lineWidth = 2; g.fillRect(x0, y0, LW, LH); g.strokeRect(x0, y0, LW, LH); g.textBaseline = 'top'; g.font = '800 15px system-ui'; g.fillStyle = '#ffe28a'; g.fillText('THE OBERVERSE — world atlas (proposal; Sund redrawn down to Halvermouth)', x0 + 14, y0 + 10);
    const BC = { ice: '#e9f0f5', tundra: '#b6c2a8', taiga: '#3f6a4e', forest: '#4a8a48', grassland: '#8fbc58', steppe: '#c8b668', desert: '#e2c27c', savanna: '#c9a24a', jungle: '#2a7a46', mountain: '#8d877b', volcanic: '#6e4a44' }; g.font = '600 12.5px system-ui'; let cx = x0 + 14, cy = y0 + 36; Object.entries(BC).forEach(([b, c]) => { g.fillStyle = c; g.fillRect(cx, cy, 13, 13); g.fillStyle = '#e8eef4'; g.fillText(b, cx + 18, cy); cx += 68; });
    cx = x0 + 14; cy += 24; Object.entries(A.countries).forEach(([id, c]) => { g.fillStyle = c.color; g.fillRect(cx, cy, 13, 13); g.fillStyle = '#e8eef4'; g.fillText(id === 'free' ? 'free territories' : c.name.replace(/^(The |Kingdom of |Republic of |Grand Duchy of |Free State of |Free Harbour of )/, '').replace(' Isthmus Compact', '').replace(' League', '').replace(' Union', ''), cx + 18, cy); cx += id === 'free' ? 130 : (id === 'ostmark' || id === 'westreach' || id === 'sunmouth' ? 118 : 92); });
    cx = x0 + 14; cy += 24; g.font = '600 12px system-ui'; [['★ capital', '#ffd24a'], ['● port', '#7fe8ff'], ['● city', '#fff'], ['● mine / oil', '#e0b04a'], ['● industry', '#c58aff'], ['◆ military', '#ff6a5a'], ['━ main road', '#ffe18c'], ['╌ local road', '#ddd'], ['▬ country border', '#fff4c8']].forEach(([t, c]) => { g.fillStyle = c; g.fillText(t, cx, cy); cx += g.measureText(t).width + 18; }); }
  window.__done = true;
}
</script>
