    const hour = Math.floor(this.clock.total / 60);
    if (hour !== this.world.lastHour) {
      this.world.lastHour = hour;
      this.events.hourly();
    }
    if (Math.floor(this.clock.total) % 12 === 0) this.player.energy = Math.max(0, this.player.energy - 1);
  }

  /** Let NPCs notice the player in places they care about (profile.notices). */
  observe() {
    if (this.skipping) return;
    const p = this.player;
    const now = this.clock.total;
    const map = this.currentMap();
    for (const npc of this.npcs.values()) {
      if (npc.map !== p.map || npc.activity === 'sleep') continue;
      for (const n of npc.profile.notices || []) {
        if (n.map !== p.map) continue;
        if (!this.canSee(npc, p.x, p.y, map, 10)) continue;
        if (!recall(npc, n.tag, now, 60)) remember(npc, { text: n.text, tag: n.tag, about: 'player', importance: n.importance ?? 3 }, now);
      }
    }
  }

  canSee(npc, x, y, map, rangeTiles) {
    if (dist(npc.x, npc.y, x, y) > rangeTiles * TILE) return false;
    return map.lineOfSight(Math.floor(npc.x / TILE), Math.floor(npc.y / TILE), Math.floor(x / TILE), Math.floor(y / TILE));
  }

  ambientBarks(npc) {
    if (npc.bubble && this.realTime < npc.bubble.until) return;
    const dlg = this.content.dialogues[npc.profile.dialogue];
    if (!dlg?.barks) return;
    const near = dist(npc.x, npc.y, this.player.x, this.player.y) < TILE * 5;
    if (npc.chat) {
      if ((npc.nextChatLine || 0) < this.realTime) {
        const pool = dlg.barks[npc.chat.tone === 'argue' ? 'argue' : 'chat'] || [];
        if (pool.length) this.bark(npc, this.rng.pick(pool));
        npc.nextChatLine = this.realTime + 2.4 + this.rng.next() * 2;
      }
      return;
    }
    if (!near || (npc.nextBarkAt || 0) > this.realTime) return;
    npc.nextBarkAt = this.realTime + 9 + this.rng.next() * 10;
    const mood = this.moodOf(npc);
    const pool = (mood !== 'neutral' && dlg.barks.moods?.[mood]) || dlg.barks[npc.activity] || dlg.barks.greet || [];
    if (pool.length && this.rng.chance(0.65)) this.bark(npc, this.rng.pick(pool));
  }

  // ------------------------------------------------------------- the player
  updatePlayer(dt, input) {
    const p = this.player;
    const map = this.currentMap();
    let ix = input.x || 0;
    let iy = input.y || 0;
    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }
    const tired = p.energy <= 5;
    const sprinting = input.sprint && p.energy > 10 && len > 0;
    const speed = (sprinting ? PLAYER_SPRINT : PLAYER_SPEED) * (tired ? 0.7 : 1);
    const k = Math.min(1, dt * 14);
    p.vx += (ix * speed - p.vx) * k;
    p.vy += (iy * speed - p.vy) * k;
    if (Math.abs(p.vx) < 1 && !ix) p.vx = 0;
    if (Math.abs(p.vy) < 1 && !iy) p.vy = 0;
    if (sprinting) p.sprintAcc = (p.sprintAcc || 0) + dt;
    if (p.sprintAcc > 3) {
      p.sprintAcc = 0;
      p.energy = Math.max(0, p.energy - 1);
    }
    if (len > 0.1) p.facing = Math.abs(ix) > Math.abs(iy) ? (ix > 0 ? 'right' : 'left') : iy > 0 ? 'down' : 'up';

    const actor = this.playerActor();
    const box = (x, y) => [x - PLAYER_BOX.w / 2, y - PLAYER_BOX.h + 2, PLAYER_BOX.w, PLAYER_BOX.h];
    const blocked = (x, y) => map.rectBlocked(...box(x, y), actor);
    const startX = p.x;
    const startY = p.y;

    const dx = p.vx * dt;
    if (dx) {
      if (!blocked(p.x + dx, p.y)) p.x += dx;
      else {
        const nudge = this.cornerNudge(p.x + dx, p.y, 'y', blocked);
        if (nudge !== null) p.y += Math.sign(nudge) * Math.min(Math.abs(nudge), 90 * dt);
        else this.bumped(p.x + dx + Math.sign(dx) * PLAYER_BOX.w / 2, p.y);
        p.vx = 0;
      }
    }
    const dy = p.vy * dt;
    if (dy) {
      if (!blocked(p.x, p.y + dy)) p.y += dy;
      else {
        const nudge = this.cornerNudge(p.x, p.y + dy, 'x', blocked);
        if (nudge !== null) p.x += Math.sign(nudge) * Math.min(Math.abs(nudge), 90 * dt);
        else this.bumped(p.x, p.y + dy + (dy > 0 ? 2 : -PLAYER_BOX.h));
        p.vy = 0;
      }
    }
    p.moving = Math.hypot(p.x - startX, p.y - startY) > 0.05;
    if (p.moving) {
      p.animTime = (p.animTime || 0) + dt * (sprinting ? 1.5 : 1);
      p.stepAcc = (p.stepAcc || 0) + Math.hypot(p.x - startX, p.y - startY);
      if (p.stepAcc > 30) {
        p.stepAcc = 0;
        this.bus.emit('player:step', { surface: map.tileType(Math.floor(p.x / TILE), Math.floor(p.y / TILE)).name });
      }
    }

    const tx = Math.floor(p.x / TILE);
    const ty = Math.floor(p.y / TILE);
    if (tx !== p.lastTx || ty !== p.lastTy) {
      p.lastTx = tx;
      p.lastTy = ty;
      const door = map.doorAt(tx, ty);
      if (door && door.to) this.useDoor(door);
      else this.updateDiscovery();
    }
  }

  /** Small sideways nudge that lets the player slide around corners and into doorways. */
  cornerNudge(x, y, axis, blocked) {
    for (let off = 1; off <= 9; off++) {
      for (const s of [-1, 1]) {
        const ox = axis === 'x' ? x + s * off : x;
        const oy = axis === 'y' ? y + s * off : y;
        if (!blocked(ox, oy)) return s * off;
      }
    }
    return null;
  }

  bumped(px, py) {
    const map = this.currentMap();
    const door = map.doorAt(Math.floor(px / TILE), Math.floor(py / TILE));
    if (!door) return;
    if (this.realTime - this.lockMessageAt < 2.5) return;
    this.lockMessageAt = this.realTime;
    const reason = this.doorLockReason(door, (key) => this.inventory.count(key) > 0);
    if (reason) {
      this.bus.emit('sfx', { id: 'sfx_locked' });
      this.notify(`${door.label ? door.label + ': ' : ''}${reason}`, 'warn');
    }
  }

  useDoor(door) {
    if (!this.playerCanPass(door)) return false;
    const lock = door.lock;
    if (lock?.trespass && !this.getFlag(`${lock.trespass}_permission`)) {
      this.reportCrime({ fact: `fact_player_trespassed_${lock.trespass}`, map: this.player.map, x: this.player.x, y: this.player.y });
    }
    this.bus.emit('sfx', { id: 'sfx_door' });
    this.changeMap(door.to.map, door.to.spot);
    return true;
  }

  changeMap(mapId, spotName) {
    const map = this.maps.get(mapId);
    const s = map?.spotPx(spotName);
    if (!map || !s) {
      this.warn(`changeMap: bad target ${mapId}:${spotName}`);
      return false;
    }
    const from = this.player.map;
    const p = this.player;
    p.map = mapId;
    p.x = s.x;
    p.y = s.y;
    p.vx = 0;
    p.vy = 0;
    if (s.facing) p.facing = s.facing;
    p.lastTx = Math.floor(p.x / TILE);
    p.lastTy = Math.floor(p.y / TILE);
    p.discovered.maps[mapId] = true;
    if (map.def.restricted && !this.getFlag(`${map.def.restricted}_permission`)) this.setFlag(`trespassed_${map.def.restricted}`, true);
    this.npcSystem.onPlayerMapChanged();
    this.bus.emit('map:entered', { map: mapId, from });
    this.updateDiscovery();
    return true;
  }

  updateDiscovery() {
    const p = this.player;
    const map = this.currentMap();
    const area = map.areaAt(Math.floor(p.x / TILE), Math.floor(p.y / TILE));
    const key = area ? area.id : `map:${map.id}`;
    p.areaName = area ? area.name : map.name;
    if (!p.discovered.areas[key]) {
      p.discovered.areas[key] = true;
      this.bus.emit('area:discovered', { id: key, name: p.areaName });
      if (area) this.notify(`Discovered: ${area.name}`, 'discover');
    }
  }

  // --------------------------------------------------------------- crimes
  witnesses(mapId, x, y, rangeTiles = WITNESS_RANGE_TILES) {
    const map = this.maps.get(mapId);
    const out = [];
    for (const npc of this.npcs.values()) {
      if (npc.map !== mapId || npc.activity === 'sleep') continue;
      if (this.canSee(npc, x, y, map, rangeTiles)) out.push(npc);
    }
    return out;
  }

  reportCrime({ fact, map, x, y, radius = WITNESS_RANGE_TILES }) {
    const seen = this.witnesses(map, x, y, radius);
    for (const npc of seen) this.knowledge.learn(npc, fact, { kind: 'fact', source: 'witnessed', at: this.clock.total });
    if (seen.length) this.notify(`${seen.map((n) => n.profile.shortName).join(' and ')} saw that!`, 'warn');
    this.bus.emit('crime', { fact, witnesses: seen.map((n) => n.id) });
    return seen;
  }

  makeNoise({ sources = [], radius = 12, fact, sfx, text }) {
    let playerHeard = false;
    const heard = new Set();
    for (const ref of sources) {
      const { map: mapId, spot } = parseSpotRef(ref);
      const pos = this.maps.get(mapId)?.spotPx(spot);
      if (!pos) continue;
      for (const npc of this.npcs.values()) {
        if (npc.map !== mapId || npc.activity === 'sleep' || heard.has(npc.id)) continue;
        if (dist(npc.x, npc.y, pos.x, pos.y) <= radius * TILE) heard.add(npc.id);
      }
      if (this.player.map === mapId && dist(this.player.x, this.player.y, pos.x, pos.y) <= radius * TILE) playerHeard = true;
    }
    for (const id of heard) this.knowledge.learn(this.npcs.get(id), fact, { kind: 'fact', source: 'heard', at: this.clock.total });
    if (playerHeard) {
      if (sfx) this.bus.emit('sfx', { id: sfx });
      if (text) this.notify(text, 'event');
      if (fact) this.knowledge.learn(this.player, fact, { kind: 'fact', source: 'heard', at: this.clock.total });
    }
    return [...heard];
  }

  sendOnErrand(npc, { spot, activity = 'errand', minutes = 30 }) {
    const now = this.clock.total;
    const block = blockAt(npc.profile.schedule, this.clock.minuteOfDay + (npc.profile.punctuality ?? 0));
    npc.intent = { activity, spot, source: 'errand', until: now + minutes, fromBlock: block?.index };
    npc.activity = activity;
    npc.arrived = false;
    npc.chat = null;
    this.npcSystem.plan(npc);
  }

  // ---------------------------------------------------------- knowledge
  onFactLearned({ who, factId, kind, source }) {
    const def = this.content.facts[factId];
    if (!def) return;
    if (who === 'player') {
      this.notify(`New information: ${def.text}`, 'info');
      return;
    }
    const npc = this.npcs.get(who);
    if (!npc) return;
    const reaction = npc.profile.reactions?.[factId];
    if (def.aboutPlayer) {
      const scale = kind === 'rumor' ? 0.5 : 1;
      const base = reaction?.relOverride || def.relImpact || {};
      const deltas = {};
      for (const [dim, v] of Object.entries(base)) deltas[dim] = Math.round(v * scale);
      this.relationships.adjust(npc, 'player', deltas, `learned:${factId}`);
      remember(npc, { text: def.text, tag: factId, about: 'player', importance: def.importance ?? 4 }, this.clock.total);
      if (!this.world.publicFacts[factId]) {
        this.world.publicFacts[factId] = true;
        for (const [fac, d] of Object.entries(def.reputation || {})) this.adjustReputation(fac, d);
      }
    }
    if (reaction) {
      if (reaction.rel) this.relationships.adjust(npc, 'player', reaction.rel, `reaction:${factId}`);
      if (reaction.mood) this.setMood(npc, reaction.mood.id, reaction.mood.minutes);
      if (reaction.bark && npc.map === this.player.map) this.bark(npc, reaction.bark);
    }
    if (source !== 'innate' && npc.map === this.player.map && source?.startsWith('told:')) {
      this.bus.emit('npc:heard', { npcId: npc.id, factId });
    }
  }

  // --------------------------------------------------------- interaction
  /** Things the player could interact with right now, best first. */
  interactables() {
    const p = this.player;
    const map = this.currentMap();
    const out = [];
    const fx = p.facing === 'left' ? -1 : p.facing === 'right' ? 1 : 0;
    const fy = p.facing === 'up' ? -1 : p.facing === 'down' ? 1 : 0;
    const score = (x, y) => {
      const d = dist(p.x, p.y, x, y);
      const dot = ((x - p.x) * fx + (y - p.y) * fy) / (d || 1);
      return d - dot * 14;
    };
    for (const npc of this.npcs.values()) {
      if (npc.map !== p.map) continue;
      const d = dist(p.x, p.y, npc.x, npc.y);
      if (d > INTERACT_RANGE) continue;
      out.push({ kind: 'npc', id: npc.id, label: npc.activity === 'sleep' ? `${npc.profile.shortName} (asleep)` : `Talk to ${npc.profile.shortName}`, score: score(npc.x, npc.y) - 6 });
    }
    for (const prop of map.props) {
      if (!prop.interact && !prop.examine) continue;
      if (prop.hiddenUnless && !check(prop.hiddenUnless, this)) continue;
      if (prop.type === 'item' && this.world.props[prop.id]?.taken) continue;
      const cx = clamp(p.x, prop.x * TILE, (prop.x + prop.w) * TILE);
      const cy = clamp(p.y, prop.y * TILE, (prop.y + prop.h) * TILE);
      const d = dist(p.x, p.y, cx, cy);
      if (d > INTERACT_RANGE - 12) continue;
      out.push({ kind: 'prop', id: prop.id, label: this.propLabel(prop), score: score(cx, cy) });
    }
    const tx = Math.floor(p.x / TILE);
    const ty = Math.floor(p.y / TILE);
    for (const door of map.doors) {
      if (Math.abs(door.x - tx) + Math.abs(door.y - ty) !== 1) continue;
      const cx = (door.x + 0.5) * TILE;
      const cy = (door.y + 0.5) * TILE;
      const locked = !this.playerCanPass(door);
      out.push({ kind: 'door', id: door.id, label: locked ? `${door.label || 'Door'} (locked)` : `Enter ${door.label || 'door'}`, score: score(cx, cy) + 4 });
    }
    return out.sort((a, b) => a.score - b.score);
  }

  propLabel(prop) {
    const type = this.content.propTypes[prop.type];
    const name = prop.interact?.name || prop.name || type?.label || 'Object';
    switch (prop.interact?.kind) {
      case 'container': return `Search ${this.content.containers[prop.interact.container]?.name || name}`;
      case 'read': return `Read ${this.content.docs[prop.interact.doc]?.title || name}`;
      case 'sleep': return 'Sleep';
      case 'sit': return 'Sit and rest';
      case 'noticeboard': return 'Read the notice board';
      case 'obstacle': return this.world.props[prop.id]?.open ? `Climb through the ${name.toLowerCase()}` : `Examine ${name.toLowerCase()}`;
      case 'forage': return 'Pick wildflowers';
      case 'stockcheck': return 'Look at the display case';
      default: return prop.type === 'item' ? 'Pick up' : `Examine ${name.toLowerCase()}`;
    }
  }

  /**
   * Perform an interaction. Returns a UI action descriptor:
   * {type:'dialogue'|'message'|'container'|'read'|'sleep'|'none', ...}
   */
  interact(target) {
    if (!target) return { type: 'none' };
    if (target.kind === 'npc') {
      const npc = this.npcs.get(target.id);
      if (!npc) return { type: 'none' };
      if (npc.activity === 'sleep') {
        const pool = this.content.dialogues[npc.profile.dialogue]?.barks?.sleep || ['Zzz…'];
        this.bark(npc, this.rng.pick(pool));
        return { type: 'message', text: `${npc.profile.shortName} is fast asleep.` };
      }
      return { type: 'dialogue', npcId: npc.id };
    }
    if (target.kind === 'door') {
      const door = this.currentMap().doors.find((d) => d.id === target.id);
      if (!door) return { type: 'none' };
      if (!this.playerCanPass(door)) {
        this.lockMessageAt = -10;
        const reason = this.doorLockReason(door, (key) => this.inventory.count(key) > 0);
        this.bus.emit('sfx', { id: 'sfx_locked' });
        return { type: 'message', text: reason };
      }
      this.useDoor(door);
      return { type: 'none' };
    }
    const prop = this.currentMap().prop(target.id);
    if (!prop) return { type: 'none' };
    this.bus.emit('prop:used', { id: prop.id, kind: prop.interact?.kind || 'examine' });
    const act = prop.interact;
    if (prop.type === 'item' && prop.item) {
      this.world.props[prop.id] = { ...(this.world.props[prop.id] || {}), taken: true };
      this.inventory.add(prop.item, 1);
      return { type: 'message', text: `You found: ${this.content.items[prop.item].name}.` };
    }
    if (!act) {
      if (prop.onExamine) this.applyEffects(prop.onExamine);
      return { type: 'message', text: prop.examine };
    }
    switch (act.kind) {
      case 'container':
        return { type: 'container', containerId: act.container };
      case 'read': {
        const doc = this.content.docs[act.doc];
        this.applyEffects(doc?.effects);
        this.bus.emit('doc:read', { id: act.doc });
        return { type: 'read', title: doc.title, body: doc.body };
      }
      case 'noticeboard':
        return this.readNoticeboard();
      case 'sleep':
        return { type: 'sleep' };
      case 'sit':
        this.player.energy = Math.min(100, this.player.energy + 3);
        return { type: 'message', text: 'You sit for a moment and watch Lanternside go by. (+3 energy)' };
      case 'forage': {
        const st = this.world.props[prop.id] || {};
        if (st.day === this.clock.day) return { type: 'message', text: 'You\'ve already picked what\'s blooming today.' };
        this.world.props[prop.id] = { ...st, day: this.clock.day };
        this.inventory.add(act.item, 1);
        return { type: 'message', text: 'You pick a small bunch of wildflowers.' };
      }
      case 'stockcheck': {
        const stock = this.world.shops[act.shop]?.stock || {};
        const lines = Object.entries(stock).map(([id, n]) => `${this.content.items[id]?.name}: ${n > 0 ? n : 'sold out'}`);
        return { type: 'message', text: `In the display case — ${lines.join(', ')}.` };
      }
      case 'obstacle':
        return this.useObstacle(prop);
      default:
        return { type: 'message', text: prop.examine || 'Nothing happens.' };
    }
  }

  readNoticeboard() {
    const posts = [];
    for (const n of this.content.notices || []) {
      if (n.if && !check(n.if, this)) continue;
      posts.push(n.text);
      if (n.learn) this.knowledge.learn(this.player, n.learn, { kind: 'fact', source: 'notice', at: this.clock.total });
    }
    return { type: 'read', title: 'Civic Square Notice Board', body: posts };
  }

  useObstacle(prop) {
    const act = prop.interact;
    const st = this.world.props[prop.id] || {};
    if (st.open) {
      const enter = act.enter;
      if (enter.trespass && !this.getFlag(`${enter.trespass}_permission`)) {
        this.reportCrime({ fact: `fact_player_trespassed_${enter.trespass}`, map: this.player.map, x: this.player.x, y: this.player.y });
      }
      this.changeMap(enter.map, enter.spot);
      return { type: 'none' };
    }
    if (act.requires?.item && this.inventory.count(act.requires.item) > 0) {
      this.world.props[prop.id] = { ...st, open: true };
      this.bus.emit('sfx', { id: 'sfx_pry' });
      if (act.noise) {
        this.reportCrime({ fact: 'fact_player_trespassed_lighthouse', map: this.player.map, x: this.player.x, y: this.player.y, radius: act.noise.radius });
      }
      this.bus.emit('prop:opened', { id: prop.id });
      return { type: 'message', text: `${act.verb || 'Open'}: with a shriek of rust, the hatch gives way. ${act.openedText}` };
    }
    return { type: 'message', text: act.closedText };
  }

  // ------------------------------------------------------------ containers
  containerView(id) {
    const def = this.content.containers[id];
    const st = this.world.containers[id];
    return {
      id,
      name: def.name,
      owner: def.owner,
      ownerName: this.npcs.get(def.owner)?.profile.shortName || this.content.factions[def.owner]?.name || (def.owner === 'player' ? 'you' : def.owner),
      items: Object.entries(st.items).filter(([, n]) => n > 0).map(([itemId, count]) => ({ id: itemId, count, def: this.content.items[itemId] })),
      money: st.money,
    };
  }

  /**
   * Take an item (or 'money') from a container. Ownership and witnesses decide
   * whether this is allowed, theft, or blocked.
   * @returns {{ok:boolean, text:string, stolen?:boolean}}
   */
  takeFromContainer(id, itemId) {
    const def = this.content.containers[id];
    const st = this.world.containers[id];
    if (!def || !st) return { ok: false, text: 'Nothing there.' };
    const isMoney = itemId === 'money';
    if (isMoney ? st.money <= 0 : !(st.items[itemId] > 0)) return { ok: false, text: 'Nothing there.' };
    let stolen = false;
    const permitted = def.owner === 'player' || (itemId === 'item_lighthouse_key' && this.getFlag('lighthouse_permission'));
    if (!permitted) {
      const seen = this.witnesses(this.player.map, this.player.x, this.player.y, 8);
      const owner = seen.find((n) => n.id === def.owner);
      if (owner) {
        this.bark(owner, 'Hands OFF. That is not yours.');
        this.relationships.adjust(owner, 'player', { trust: -6, suspicion: 12 }, 'caught_theft');
        remember(owner, { text: 'Caught the newcomer rummaging in my things.', tag: 'caught_theft', about: 'player', importance: 7 }, this.clock.total);
        this.bus.emit('sfx', { id: 'sfx_fail' });
        return { ok: false, text: `${owner.profile.shortName} catches you reaching in. You pull your hand back.` };
      }
      stolen = true;
      if (seen.length && def.owner === 'npc_osric') this.reportCrime({ fact: 'fact_player_stole_from_osric', map: this.player.map, x: this.player.x, y: this.player.y, radius: 8 });
    }
    if (isMoney) {
      const amount = st.money;
      st.money = 0;
      this.player.money += amount;
      this.bus.emit('money:changed', { delta: amount, total: this.player.money });
      return { ok: true, stolen, text: `You take ${amount} obols${stolen ? ' that aren\'t yours' : ''}.` };
    }
    st.items[itemId]--;
    this.inventory.add(itemId, 1, { stolenFrom: stolen ? def.owner : null });
    return { ok: true, stolen, text: `Taken: ${this.content.items[itemId].name}${stolen ? ' (not yours)' : ''}.` };
  }

        ctx.fillRect(gx, gy, 1.5, 4);
      }
      if (r > 0.93) {
        ctx.fillStyle = ['#f6e27a', '#f2a7c3', '#ffffff'][Math.floor(r * 100) % 3];
        ctx.beginPath(); ctx.arc(px + 10 + r * 10, py + 12, 1.8, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case ',': {
      ctx.strokeStyle = 'rgba(90,80,70,0.12)';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, T / 2, T / 2);
      ctx.strokeRect(px + T / 2 + 0.5, py + T / 2 + 0.5, T / 2 - 1, T / 2 - 1);
      break;
    }
    case '=': {
      const left = map.tileAt(x - 1, y) === '=';
      const up = map.tileAt(x, y - 1) === '=';
      const down = map.tileAt(x, y + 1) === '=';
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(px + r * 20, py + hash2(y, x) * 24, 3, 2);
      // centre dashes between the two road lanes
      ctx.fillStyle = 'rgba(240,226,170,0.55)';
      if (!up && down && x % 3 === 0 && left) ctx.fillRect(px, py + T - 1.5, T * 0.55, 3);
      const right = map.tileAt(x + 1, y) === '=';
      if (left && !right && up && down && y % 3 === 0) ctx.fillRect(px - 1.5, py, 3, T * 0.55);
      break;
    }
    case ':': {
      ctx.fillStyle = 'rgba(120,90,60,0.18)';
      for (let i = 0; i < 4; i++) ctx.fillRect(px + hash2(x + i, y) * T, py + hash2(x, y + i) * T, 2, 2);
      break;
    }
    case 's': {
      ctx.fillStyle = 'rgba(160,130,80,0.18)';
      for (let i = 0; i < 5; i++) ctx.fillRect(px + hash2(x + i * 3, y) * T, py + hash2(x, y + i * 5) * T, 1.5, 1.5);
      break;
    }
    case 'b':
    case 'p': {
      ctx.strokeStyle = 'rgba(60,35,20,0.35)';
      ctx.lineWidth = 1;
      const vertical = ch === 'b' && map.tileAt(x, y - 1) !== '~' && map.tileAt(x, y + 1) !== '~' ? false : ch === 'b';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        if (vertical) { ctx.moveTo(px, py + i * 8 + 0.5); ctx.lineTo(px + T, py + i * 8 + 0.5); }
        else { ctx.moveTo(px + i * 8 + 0.5, py); ctx.lineTo(px + i * 8 + 0.5, py + T); }
        ctx.stroke();
      }
      break;
    }
    case 'r': {
      ctx.fillStyle = '#3f88a8';
      ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#8d8f94';
      ctx.beginPath(); ctx.ellipse(px + 16, py + 18, 14, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a5a7ab';
      ctx.beginPath(); ctx.ellipse(px + 13, py + 14, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'f': {
      ctx.strokeStyle = 'rgba(80,50,30,0.22)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(px, py + i * 8 + 0.5); ctx.lineTo(px + T, py + i * 8 + 0.5); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(px + (r * 32) | 0, py); ctx.lineTo(px + (r * 32) | 0, py + 8); ctx.stroke();
      break;
    }
    case 't': {
      ctx.strokeStyle = 'rgba(120,110,100,0.18)';
      ctx.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
      if ((x + y) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(px, py, T, T); }
      break;
    }
    case 'g': {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(px + r * 24, py + hash2(y, x) * 24, 6, 4);
      break;
    }
    case 'c': {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      if ((x + y) % 2) ctx.fillRect(px, py, T, T);
      break;
    }
    default:
      break;
  }
}

function drawTileEdges(ctx, map, x, y) {
  const ch = map.tileAt(x, y);
  const px = x * T;
  const py = y * T;
  if (ch === '~') {
    // shoreline foam/stone lip next to land
    const landUp = map.tileAt(x, y - 1) !== '~' && map.tileAt(x, y - 1) !== 'x' && map.tileAt(x, y - 1) !== 'r';
    if (landUp && y > 0) {
      ctx.fillStyle = map.tileAt(x, y - 1) === 's' ? 'rgba(255,255,255,0.35)' : '#8b8b86';
      ctx.fillRect(px, py, T, 5);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(px, py + 5, T, 4);
    }
    const landDown = !['~', 'x', 'r', 'b'].includes(map.tileAt(x, y + 1)) && y < map.height - 1;
    if (landDown) {
      ctx.fillStyle = '#8b8b86';
      ctx.fillRect(px, py + T - 3, T, 3);
    }
    for (const [dx, sx] of [[-1, 0], [1, T - 3]]) {
      const n = map.tileAt(x + dx, y);
      if (!['~', 'x', 'r', 'b', 'p'].includes(n) && x + dx >= 0 && x + dx < map.width) {
        ctx.fillStyle = '#8b8b86';
        ctx.fillRect(px + sx, py, 3, T);
      }
    }
  }
  if (ch === '.') {
    // grass blades overhanging adjacent paving
    ctx.fillStyle = 'rgba(70,110,60,0.35)';
    if ([',', '=', ':'].includes(map.tileAt(x, y + 1))) ctx.fillRect(px, py + T - 2, T, 2);
  }
}

function drawInteriorWalls(ctx, map) {
  const wallFace = '#e9dcc3';
  const wallTop = '#5b4a45';
  for (let y = 0; y < map.height; y++) {
    for (let x = 0; x < map.width; x++) {
      const ch = map.tileAt(x, y);
      const px = x * T;
      const py = y * T;
      if (ch === 'W') {
        if (y === 0) {
          // back wall: tall face with wainscot
          ctx.fillStyle = wallFace;
          ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#d2c2a5';
          ctx.fillRect(px, py + T * 0.62, T, T * 0.38);
          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.fillRect(px, py + T * 0.62, T, 2);
          ctx.fillStyle = wallTop;
          ctx.fillRect(px, py, T, 5);
        } else {
          ctx.fillStyle = wallTop;
          ctx.fillRect(px, py, T, T);
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
        }
      } else if (ch === 'D') {
        ctx.fillStyle = '#3d2f28';
        ctx.fillRect(px + 3, py, T - 6, T);
        ctx.fillStyle = '#8f5e3d';
        ctx.fillRect(px + 6, py + 6, T - 12, T - 10);
        ctx.fillStyle = 'rgba(255,240,200,0.18)';
        ctx.fillRect(px + 6, py + 6, T - 12, 3);
      } else if (y === 1 && map.tileAt(x, 0) === 'W') {
        // shadow cast by the back wall
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(px, py, T, 6);
      }
    }
  }
}

/** Animated water highlights for visible water tiles. */
function drawWaterShimmer(ctx, map, view, time) {
  const x0 = Math.max(0, Math.floor(view.x / T));
  const y0 = Math.max(0, Math.floor(view.y / T));
  const x1 = Math.min(map.width - 1, Math.ceil((view.x + view.w) / T));
  const y1 = Math.min(map.height - 1, Math.ceil((view.y + view.h) / T));
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (map.tileAt(x, y) !== '~') continue;
      const r = hash2(x, y);
      const phase = (time * 0.6 + r * 6.28) % 6.28;
      const a = Math.max(0, Math.sin(phase));
      if (a < 0.15) continue;
      ctx.globalAlpha = a * 0.8;
      const px = x * T + 6 + r * 14;
      const py = y * T + 8 + hash2(y, x) * 16 + Math.sin(time + r * 3) * 2;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + 4, py - 2, px + 8, py);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// --------------------------------------------------------------- buildings
/**
 * @param {object} b building def
 * @param {object} opts {lit:boolean, time:number, doorOpen:boolean}
 */
function drawBuilding(ctx, b, opts) {
  if (b.round) return drawLighthouse(ctx, b, opts);
  const left = b.x * T;
  const right = (b.x + b.w) * T;
  const top = b.y * T;
  const bottom = (b.y + b.h) * T;
  const wallH = Math.min(1.7 * T, (b.h - 1) * T * 0.45);
  const roofTop = top - 0.55 * T;
  const roofBottom = bottom - wallH;

  // ground shadow
  ctx.fillStyle = 'rgba(25,25,45,0.22)';
  ctx.fillRect(left + 6, roofBottom, right - left + 4, wallH + 6);

  // front wall
  ctx.fillStyle = b.wall;
  ctx.fillRect(left, roofBottom, right - left, wallH);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(left, bottom - 6, right - left, 6);
  ctx.fillStyle = b.trim;
  ctx.fillRect(left, bottom - 3, right - left, 3);

  // windows
  const doorX = b.door ? b.door.x * T : -999;
  const winY = roofBottom + wallH * 0.22;
  const winH = wallH * 0.42;
  for (let wx = left + 0.35 * T; wx + 0.65 * T <= right - 0.2 * T; wx += T * 1.25) {
    if (wx + 0.7 * T > doorX - 4 && wx < doorX + T + 4) continue;
    ctx.fillStyle = b.trim;
    ctx.fillRect(wx - 2, winY - 2, 0.7 * T + 4, winH + 4);
    ctx.fillStyle = opts.lit ? '#ffd88a' : '#7aa3b8';
    ctx.fillRect(wx, winY, 0.7 * T, winH);
    if (!opts.lit) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(wx + 2, winY + 2, 4, winH - 4);
    }
    ctx.fillStyle = b.trim;
    ctx.fillRect(wx + 0.35 * T - 1, winY, 2, winH);
  }

  // pilasters between the windows
  if (b.columns) {
    for (let cx = left + 2; cx < right - 4; cx += T * 1.25) {
      if (cx + 8 > doorX - 4 && cx < doorX + T + 4) continue;
      ctx.fillStyle = '#f7f4ee';
      ctx.fillRect(cx, roofBottom + 2, 7, wallH - 6);
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.fillRect(cx + 5, roofBottom + 2, 2, wallH - 6);
    }
  }

  // awning
  if (b.awning) {
    const aw = right - left;
    for (let i = 0; i < aw / 10; i++) {
      ctx.fillStyle = i % 2 ? '#f3e5c6' : b.awning;
      ctx.fillRect(left + i * 10, roofBottom - 2, 10, 9);
      ctx.beginPath();
      ctx.arc(left + i * 10 + 5, roofBottom + 7, 5, 0, Math.PI);
      ctx.fill();
    }
  }

  // door
  if (b.door) {
    const dx = b.door.x * T + 4;
    const dw = T - 8;
    const dh = Math.min(wallH - 4, T * 1.1);
    ctx.fillStyle = b.trim;
    ctx.fillRect(dx - 3, bottom - dh - 3, dw + 6, dh + 3);
    ctx.fillStyle = opts.doorLocked ? shade(b.trim, -25) : '#6b4a32';
    ctx.fillRect(dx, bottom - dh, dw, dh);
    ctx.fillStyle = opts.lit ? 'rgba(255,214,140,0.55)' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(dx + 3, bottom - dh + 3, dw - 6, dh * 0.3);
    ctx.fillStyle = '#e8c35a';
    ctx.beginPath(); ctx.arc(dx + dw - 5, bottom - dh * 0.45, 1.8, 0, Math.PI * 2); ctx.fill();
    // step
    ctx.fillStyle = 'rgba(120,110,100,0.8)';
    ctx.fillRect(dx - 3, bottom, dw + 6, 3);
  }

  // roof (gabled, seen from above at an angle)
  const eave = 6;
  const rl = left - eave;
  const rr = right + eave;
  const ridge = roofTop + (roofBottom - roofTop) * 0.45;
  ctx.fillStyle = shade(b.roof, 22);
  ctx.beginPath();
  ctx.moveTo(rl + 8, roofTop); ctx.lineTo(rr - 8, roofTop); ctx.lineTo(rr, ridge); ctx.lineTo(rl, ridge); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = b.roof;
  ctx.beginPath();
  ctx.moveTo(rl, ridge); ctx.lineTo(rr, ridge); ctx.lineTo(rr, roofBottom + 4); ctx.lineTo(rl, roofBottom + 4); ctx.closePath();
  ctx.fill();
  // tile rows
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  for (let ry = ridge + 7; ry < roofBottom; ry += 7) {
    ctx.beginPath(); ctx.moveTo(rl, ry); ctx.lineTo(rr, ry); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  for (let ry = roofTop + 6; ry < ridge; ry += 7) {
    ctx.beginPath(); ctx.moveTo(rl + 6, ry); ctx.lineTo(rr - 6, ry); ctx.stroke();
  }
  ctx.fillStyle = shade(b.roof, -30);
  ctx.fillRect(rl, ridge - 1.5, rr - rl, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(rl, roofBottom + 2, rr - rl, 3);
  // chimney on homes
  if (!b.sign) {
    const cx = right - T * 1.3;
    ctx.fillStyle = '#8a5a48';
    ctx.fillRect(cx, roofTop - 10, 12, (ridge - roofTop) + 4);
    ctx.fillStyle = '#5e3c30';
    ctx.fillRect(cx - 2, roofTop - 12, 16, 4);
    if (opts.lit) {
      ctx.fillStyle = 'rgba(220,220,230,0.35)';
      const s = (opts.time * 8) % 20;
      ctx.beginPath(); ctx.arc(cx + 6 + Math.sin(opts.time) * 2, roofTop - 16 - s, 4 + s * 0.2, 0, Math.PI * 2); ctx.fill();
    }
  }
  // sign board
  if (b.sign) {
    ctx.font = 'bold 9px "Trebuchet MS", "Segoe UI", sans-serif';
    const tw = ctx.measureText(b.sign).width + 10;
    const sx = b.door ? Math.min(Math.max(b.door.x * T + T / 2 - tw / 2, left + 2), right - tw - 2) : left + (right - left - tw) / 2;
    const sy = roofBottom - 4;
    ctx.fillStyle = '#3a2c25';
    rrect(ctx, sx, sy, tw, 13, 3);
    ctx.fill();
    ctx.fillStyle = '#f6e7c1';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.sign, sx + 5, sy + 7);
  }
}

function drawLighthouse(ctx, b, opts) {
  const cx = (b.x + b.w / 2) * T;
  const bottom = (b.y + b.h) * T;
  const baseW = b.w * T * 0.9;
  const topW = baseW * 0.62;
  const towerTop = b.y * T - T * 3.2;
  ctx.fillStyle = 'rgba(25,25,45,0.25)';
  ctx.beginPath(); ctx.ellipse(cx + 10, bottom - 4, baseW * 0.6, 10, 0, 0, Math.PI * 2); ctx.fill();
  // tower body with stripes
  const bands = 5;
  for (let i = 0; i < bands; i++) {
    const t0 = i / bands;
    const t1 = (i + 1) / bands;
    const y0 = bottom - (bottom - towerTop) * t0;
    const y1 = bottom - (bottom - towerTop) * t1;
    const w0 = baseW + (topW - baseW) * t0;
    const w1 = baseW + (topW - baseW) * t1;
    ctx.fillStyle = i % 2 ? b.roof : b.wall;
    ctx.beginPath();
    ctx.moveTo(cx - w0 / 2, y0); ctx.lineTo(cx + w0 / 2, y0); ctx.lineTo(cx + w1 / 2, y1); ctx.lineTo(cx - w1 / 2, y1); ctx.closePath();
    ctx.fill();
  }
  // shading
  const g = ctx.createLinearGradient(cx - baseW / 2, 0, cx + baseW / 2, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.18)');
  g.addColorStop(0.45, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - baseW / 2, bottom); ctx.lineTo(cx + baseW / 2, bottom); ctx.lineTo(cx + topW / 2, towerTop); ctx.lineTo(cx - topW / 2, towerTop); ctx.closePath();
  ctx.fill();
  // gallery + lantern room (dark: the lens is missing)
  ctx.fillStyle = '#3b3b45';
  ctx.fillRect(cx - topW / 2 - 6, towerTop - 4, topW + 12, 5);
  ctx.fillStyle = opts.lampLit ? '#fff3b0' : '#2a3440';
  ctx.fillRect(cx - topW / 2 + 3, towerTop - 24, topW - 6, 20);
  ctx.strokeStyle = '#1d1d25';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    const lx = cx - topW / 2 + 3 + ((topW - 6) / 4) * i;
    ctx.beginPath(); ctx.moveTo(lx, towerTop - 24); ctx.lineTo(lx, towerTop - 4); ctx.stroke();
  }
  ctx.fillStyle = b.roof;
  ctx.beginPath();
  ctx.moveTo(cx - topW / 2, towerTop - 24); ctx.lineTo(cx, towerTop - 40); ctx.lineTo(cx + topW / 2, towerTop - 24); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1d1d25';
  ctx.fillRect(cx - 1, towerTop - 47, 2, 8);
  // door
  if (b.door) {
    const dx = b.door.x * T + 5;
    ctx.fillStyle = '#4a3328';
    rrect(ctx, dx, bottom - T * 1.05, T - 10, T * 1.05, 6);
    ctx.fill();
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath(); ctx.arc(dx + T - 15, bottom - T * 0.5, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  // a single small window
  ctx.fillStyle = '#2a3440';
  ctx.fillRect(cx - 4, bottom - (bottom - towerTop) * 0.55, 8, 12);
}

// ------------------------------------------------------------------- props
/** Props drawn flat on the ground before y-sorted objects. */
const FLAT_PROPS = new Set(['rug', 'flowerbed', 'window', 'chair', 'item']);

function drawProp(ctx, p, opts) {
  const x = p.x * T;
  const y = p.y * T;
  const w = p.w * T;
  const h = p.h * T;
  const time = opts.time || 0;
  switch (p.type) {
    case 'tree': {
      const sway = Math.sin(time * 0.8 + p.x) * 1.2;
      ctx.fillStyle = 'rgba(20,30,20,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 16, y + 28, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6b4a32';
      ctx.fillRect(x + 12, y + 8, 8, 22);
      const c = p.color || '#4f8a4a';
      ctx.fillStyle = shade(c, -18);
      ctx.beginPath(); ctx.arc(x + 16 + sway, y - 2, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x + 9 + sway, y - 6, 13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 23 + sway, y - 8, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = shade(c, 22);
      ctx.beginPath(); ctx.arc(x + 13 + sway, y - 14, 8, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'pine': {
      const sway = Math.sin(time * 0.7 + p.y) * 1;
      ctx.fillStyle = 'rgba(20,30,20,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 16, y + 28, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a3d2a';
      ctx.fillRect(x + 13, y + 14, 6, 16);
      const layers = ['#2f5d46', '#386b51', '#41795b'];
      layers.forEach((col, i) => {
        ctx.fillStyle = col;
        const ty = y + 18 - i * 11;
        const half = 17 - i * 4;
        ctx.beginPath();
        ctx.moveTo(x + 16 - half + sway * i * 0.5, ty);
        ctx.lineTo(x + 16 + sway * i, ty - 18);
        ctx.lineTo(x + 16 + half + sway * i * 0.5, ty);
        ctx.closePath();
        ctx.fill();
      });
      break;
    }
    case 'bush': {
      ctx.fillStyle = '#4a7f45';
      rrect(ctx, x + 1, y + 4, w - 2, h - 4, 10); ctx.fill();
      break;
    }
    case 'flowerbed': {
      ctx.fillStyle = '#6b4a32';
      rrect(ctx, x + 2, y + 6, w - 4, h - 10, 4); ctx.fill();
      ctx.fillStyle = '#5a8f4a';
      rrect(ctx, x + 4, y + 8, w - 8, h - 14, 3); ctx.fill();
      const cols = ['#f2a7c3', '#f6e27a', '#ffffff', '#c792ea'];
      for (let i = 0; i < p.w * 4; i++) {
        ctx.fillStyle = cols[i % cols.length];
        ctx.beginPath(); ctx.arc(x + 7 + (i * 7) % (w - 12), y + 12 + ((i * 5) % 8), 2.2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'bench': {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(x + 3, y + 22, w - 4, 5);
      ctx.fillStyle = '#4a3a30';
      ctx.fillRect(x + 4, y + 16, 3, 9); ctx.fillRect(x + w - 7, y + 16, 3, 9);
      ctx.fillStyle = '#a0704a';
      ctx.fillRect(x + 1, y + 12, w - 2, 6);
      ctx.fillRect(x + 1, y + 4, w - 2, 5);
      break;
    }
    case 'streetlamp': {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(x + 16, y + 28, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2f3440';
      ctx.fillRect(x + 14, y - 20, 4, 48);
      ctx.fillRect(x + 11, y + 24, 10, 4);
      ctx.fillStyle = opts.night ? '#ffe6a3' : '#cfd6dc';
      rrect(ctx, x + 9, y - 30, 14, 12, 3); ctx.fill();
      ctx.fillStyle = '#2f3440';
      ctx.fillRect(x + 8, y - 32, 16, 3);
      break;
    }
    case 'fountain': {
