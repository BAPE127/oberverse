<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oberverse Art Mock-up</title>
<style>
  html, body { margin: 0; background: #111018; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  canvas { image-rendering: pixelated; width: min(100vw - 16px, 1920px); aspect-ratio: 16 / 9; background: #000; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  nav button { background: #2a2836; color: #eee; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  nav button.on { background: #e8b83a; color: #111; }
  p { max-width: 900px; color: #aaa; margin: 0; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <nav id="nav"></nav>
  <canvas id="screen" width="1920" height="1080"></canvas>
  <p id="cap"></p>
</div>
<script>
// A mock-up of a pixel-art, Streets of Rogue 2–style look for the Oberverse (not the game).
// Everything is drawn procedurally at 480×270 and scaled ×4 with no smoothing, so every
// shape lands on a crisp pixel. Scenes: the street, a bar at night, and Ober's Oil Tower —
// the lobby, an upper floor with the city far below, and the roof.
const W = 480, H = 270, T = 16;
const low = document.createElement('canvas'); low.width = W; low.height = H;
let c = low.getContext('2d'); // reassigned to draw a scene into an offscreen canvas
const screen = document.getElementById('screen'); const sc = screen.getContext('2d');
sc.imageSmoothingEnabled = false;
let time = 0;

// ------------------------------------------------------------ palette & primitives
const P = {
  ink: '#1b1a24', asphalt: '#3e3c48', asphalt2: '#45434f', line: '#e8b83a', walk: '#8d8b95', walk2: '#82808a', seam: '#74727c',
  curbTop: '#cfc8c0', curbFace: '#6d6976', grass: '#4f7a3e', grass2: '#5a8a46',
  brick: '#b8664a', brickTop: '#e8a888', brickDark: '#8a4632', stone: '#8c95a8', stoneTop: '#c8d0dc', stoneDark: '#5e6678',
  wood: '#8a6440', wood2: '#7c5a38', woodSeam: '#5c4028', tileA: '#d8d2c4', tileB: '#2c2c36', carpet: '#6a2a3a',
  glass: '#8cc8e0', glassDark: '#4c8aa8', skin: ['#f2c8a0', '#d89a6a', '#a86a40', '#6a4028'],
};
const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
/** A rectangle with a 1px dark outline. */
const box = (x, y, w, h, col, ink = P.ink) => { R(x - 1, y - 1, w + 2, h + 2, ink); R(x, y, w, h, col); };
const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + k)));
  return `#${[(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, '0')).join('')}`;
};
const disc = (cx, cy, r, col) => { for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); R(cx - w, cy + y, w * 2 + 1, 1, col); } };
const shadow = (cx, cy, rx, ry, a = 0.3) => { c.fillStyle = `rgba(10,8,20,${a})`; for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry))); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } };
// deterministic noise
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; };

// pixel text: system font rendered small, then thresholded to hard pixels
const tcan = document.createElement('canvas'); tcan.width = 400; tcan.height = 20; const tc = tcan.getContext('2d', { willReadFrequently: true });
function text(str, x, y, col = '#fff', { size = 8, align = 'left', outline = P.ink } = {}) {
  tc.clearRect(0, 0, 400, 20);
  tc.font = `bold ${size}px "Courier New", monospace`;
  tc.textBaseline = 'top';
  const w = Math.ceil(tc.measureText(str).width) + 2;
  tc.fillStyle = '#fff'; tc.fillText(str, 1, 1);
  const img = tc.getImageData(0, 0, w, size + 4);
  const ox = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? x - w : x;
  const on = (i) => img.data[i * 4 + 3] > 110;
  if (outline) for (let i = 0; i < w * (size + 4); i++) if (on(i)) { const px = i % w, py = (i / w) | 0; R(ox + px - 1, y + py, 3, 1, outline); R(ox + px, y + py - 1, 1, 3, outline); }
  for (let i = 0; i < w * (size + 4); i++) if (on(i)) R(ox + (i % w), y + ((i / w) | 0), 1, 1, col);
  return w;
}

// ------------------------------------------------------------ ground
function asphalt(x, y, w, h) {
  R(x, y, w, h, P.asphalt);
  for (let yy = y; yy < y + h; yy += 2) for (let xx = x; xx < x + w; xx += 2) if (hash(xx, yy) > 0.86) R(xx, yy, 1, 1, P.asphalt2);
  for (let k = 0; k < (w * h) / 900; k++) { const sx = x + hash(k, x) * w, sy = y + hash(y, k) * h; R(sx, sy, 3 + hash(k, k) * 6, 1, '#36343f'); } // cracks / oil
}
function sidewalk(x, y, w, h) {
  R(x, y, w, h, P.walk);
  for (let yy = y; yy < y + h; yy += 8) for (let xx = x; xx < x + w; xx += 8) {
    R(xx, yy, 8, 1, P.seam); R(xx, yy, 1, 8, P.seam);
    if (hash(xx, yy) > 0.7) R(xx + 1, yy + 1, 7, 7, P.walk2);
    if (hash(yy, xx) > 0.93) R(xx + 3, yy + 4, 2, 1, '#6c6a74'); // gum
  }
}
/** A kerb along an edge: a light top lip and a dark face toward the road. side: 'n'|'s'|'e'|'w' = which side the road is on. */
function curb(x, y, len, side) {
  if (side === 's') { R(x, y, len, 2, P.curbTop); R(x, y + 2, len, 2, P.curbFace); }
  if (side === 'n') { R(x, y - 2, len, 2, P.curbFace); R(x, y - 4, len, 2, P.curbTop); }
  if (side === 'e') { R(x, y, 2, len, P.curbTop); R(x + 2, y, 2, len, P.curbFace); }
  if (side === 'w') { R(x - 4, y, 2, len, P.curbTop); R(x - 2, y, 2, len, P.curbFace); }
}
const dashH = (x0, x1, y) => { for (let x = x0; x < x1; x += 14) R(x, y, 7, 2, P.line); };
const dashV = (y0, y1, x) => { for (let y = y0; y < y1; y += 14) R(x, y, 2, 7, P.line); };
function crosswalk(x, y, w, h, vertical) {
  if (vertical) for (let yy = y; yy < y + h; yy += 5) R(x, yy, w, 3, '#d8d4cc');
  else for (let xx = x; xx < x + w; xx += 5) R(xx, y, 3, h, '#d8d4cc');
}
function grassPatch(x, y, w, h) { R(x, y, w, h, P.grass); for (let k = 0; k < (w * h) / 10; k++) R(x + hash(k, 3) * w, y + hash(9, k) * h, 1, 2, P.grass2); }

// ------------------------------------------------------------ interiors
function woodFloor(x, y, w, h) {
  R(x, y, w, h, P.wood);
  for (let yy = y; yy < y + h; yy += 4) { R(x, yy, w, 1, P.woodSeam); for (let xx = x + ((yy / 4) % 2) * 9; xx < x + w; xx += 18) R(xx, yy, 1, 4, P.woodSeam); if (hash(yy, x) > 0.5) R(x, yy + 1, w, 1, P.wood2); }
}
function checkerFloor(x, y, w, h, a = P.tileA, b = P.tileB, s = 8) { for (let yy = 0; yy < h; yy += s) for (let xx = 0; xx < w; xx += s) R(x + xx, y + yy, Math.min(s, w - xx), Math.min(s, h - yy), ((xx + yy) / s) % 2 ? a : b); }
function marble(x, y, w, h) { R(x, y, w, h, '#e4e0d8'); for (let yy = y; yy < y + h; yy += 16) for (let xx = x; xx < x + w; xx += 16) { R(xx, yy, 16, 1, '#c8c2b8'); R(xx, yy, 1, 16, '#c8c2b8'); if (hash(xx, yy) > 0.5) R(xx + 3, yy + 6, 8, 1, '#d4cec4'); } }
function carpet(x, y, w, h, col) { R(x, y, w, h, col); for (let yy = y; yy < y + h; yy += 3) for (let xx = x + (yy % 2); xx < x + w; xx += 4) R(xx, yy, 1, 1, shade(col, -14)); }

/** Walls, Streets-of-Rogue style: thin, roofless, a light top edge and a short front face. */
const WALL = {
  brick: { top: P.brickTop, face: P.brick, dark: P.brickDark },
  stone: { top: P.stoneTop, face: P.stone, dark: P.stoneDark },
  blue: { top: '#7ac8e8', face: '#3a7aa8', dark: '#24506e' },
  glass: { top: '#c8ecf8', face: '#6ab0d0', dark: '#3a7898' },
  plaster: { top: '#f2ece0', face: '#d8ccb8', dark: '#a89a84' },
};
function wallH(x0, x1, y, kind = 'brick', { gaps = [], windows = [] } = {}) {
  const k = WALL[kind];
  for (let x = x0; x < x1; x++) {
    if (gaps.some(([a, b]) => x >= a && x < b)) continue;
    R(x, y - 4, 1, 1, P.ink); R(x, y - 3, 1, 3, k.top); R(x, y, 1, 6, k.face); R(x, y + 6, 1, 1, P.ink);
    if (kind === 'brick' && ((x + (y % 2) * 2) % 4 === 0)) { R(x, y + 2, 1, 1, k.dark); }
    if (kind === 'brick' && ((x + 2) % 4 === 0)) R(x, y + 4, 1, 1, k.dark);
  }
  for (const a of [x0, x1 - 1]) R(a, y - 4, 1, 11, P.ink);
  for (const [a, b] of gaps) { R(a - 1, y - 4, 1, 11, P.ink); R(b, y - 4, 1, 11, P.ink); }
  for (const wx of windows) { box(wx, y + 1, 10, 4, P.glass); R(wx + 1, y + 1, 3, 1, '#e8f8ff'); }
  R(x0, y + 7, x1 - x0, 2, 'rgba(10,8,20,0.25)'); // shadow at its foot
}
function wallV(x, y0, y1, kind = 'brick', { gaps = [] } = {}) {
  const k = WALL[kind];
  for (let y = y0 - 4; y < y1 + 3; y++) {
    if (gaps.some(([a, b]) => y >= a && y < b)) continue;
    R(x - 1, y, 6, 1, P.ink); R(x, y, 4, 1, k.top);
  }
  R(x, y1 + 3, 4, 3, k.face); R(x - 1, y1 + 6, 6, 1, P.ink);
  R(x + 5, y0, 2, y1 - y0 + 6, 'rgba(10,8,20,0.22)');
}
function door(x, y, open = false) { box(x, y - 3, 12, 8, open ? '#3a2a20' : '#8a5a30'); if (!open) { R(x + 2, y - 2, 8, 1, '#a87040'); R(x + 9, y + 1, 1, 1, '#f2d060'); } }

// ------------------------------------------------------------ props
function lamp(x, y, night = false) {
  // a long shadow up and to the right, the post, the head
  c.fillStyle = 'rgba(10,8,20,0.28)'; for (let k = 0; k < 26; k++) c.fillRect(x + 1 + k, y - 1 - Math.round(k * 0.55), 2, 1);
  box(x - 1, y - 1, 4, 3, '#3a3a44');
  R(x, y - 26, 2, 25, P.ink); R(x + 1, y - 26, 1, 25, '#5a5a66');
  box(x - 2, y - 30, 6, 4, '#4a4a56'); R(x - 1, y - 27, 4, 1, night ? '#fff2b0' : '#d8d4c0');
}
function hydrant(x, y) { shadow(x + 2, y + 5, 4, 2); box(x, y, 5, 5, '#c83a2a'); R(x + 1, y + 1, 3, 1, '#e8665a'); R(x - 1, y + 2, 7, 1, P.ink); }
function bin(x, y) { shadow(x + 3, y + 7, 5, 2); box(x, y, 7, 7, '#4a5a4a'); R(x + 1, y + 1, 5, 1, '#6a7a6a'); R(x + 2, y + 3, 3, 1, '#2a3a2a'); }
function bench(x, y, w = 18) { shadow(x + w / 2, y + 7, w / 2 + 1, 2); box(x, y, w, 3, '#8a5a30'); box(x, y + 4, w, 2, '#7a4a28'); R(x + 1, y + 6, 1, 2, P.ink); R(x + w - 2, y + 6, 1, 2, P.ink); }
function tree(x, y) { shadow(x + 4, y + 4, 10, 4); R(x - 1, y - 6, 3, 8, '#5a3a22'); disc(x, y - 12, 9, P.ink); disc(x, y - 12, 8, '#3e6e2e'); disc(x - 2, y - 14, 5, '#4f8a3a'); disc(x - 3, y - 15, 2, '#6aa84a'); }
function planter(x, y, w) { box(x, y, w, 6, '#7a6a5a'); for (let k = 0; k < w; k += 3) R(x + k, y + 1, 2, 2, ['#e85a7a', '#f2d050', '#e8e8f8', '#a86ad8'][(k / 3) % 4]); R(x, y + 3, w, 2, '#3e6e2e'); }
function drain(x, y) { R(x, y, 8, 3, '#2a2832'); for (let k = 1; k < 8; k += 2) R(x + k, y, 1, 3, '#55535f'); }
function plant(x, y) { box(x, y + 2, 6, 4, '#9a5a3a'); disc(x + 3, y, 4, '#3e6e2e'); R(x + 2, y - 3, 1, 2, '#6aa84a'); R(x + 4, y - 2, 1, 2, '#6aa84a'); }
function roundTable(x, y, r = 6) { shadow(x + 1, y + r, r, 2); disc(x, y, r + 1, P.ink); disc(x, y, r, '#9a6a40'); disc(x - 2, y - 2, 2, '#b88a5a'); }
function chair(x, y, col = '#2a5aa8') { box(x, y, 5, 5, col); R(x, y, 5, 1, shade(col, 40)); }
function sofa(x, y, w = 22, col = '#3a3a44') { shadow(x + w / 2, y + 9, w / 2 + 2, 2); box(x, y, w, 8, col); R(x + 1, y + 1, w - 2, 2, shade(col, 25)); R(x + 3, y + 4, w - 6, 3, shade(col, 12)); }
function counter(x, y, w, h = 6, col = '#6a4428', top = '#c8a070') { box(x, y, w, h, col); R(x, y, w, 2, top); }
function stool(x, y) { disc(x + 2, y + 2, 2, P.ink); disc(x + 2, y + 2, 1, '#c83a3a'); }
function desk(x, y, monitor = true) { shadow(x + 9, y + 9, 10, 2); box(x, y, 18, 8, '#7a6448'); R(x, y, 18, 1, '#9a845e'); if (monitor) { box(x + 5, y - 3, 8, 5, '#2a2a34'); R(x + 6, y - 2, 6, 3, '#5ab8e8'); } R(x + 1, y + 3, 4, 3, '#e8e2d4'); }
function cabinet(x, y) { box(x, y, 8, 10, '#8a92a0'); for (let k = 1; k < 10; k += 3) { R(x, y + k + 2, 8, 1, '#6a7280'); R(x + 3, y + k, 2, 1, '#c8ccd4'); } }
function poolTable(x, y) { shadow(x + 15, y + 12, 17, 3); box(x, y, 30, 18, '#5a3a22'); R(x + 2, y + 2, 26, 14, '#2a7a4a'); for (const [a, b] of [[2, 2], [27, 2], [2, 15], [27, 15], [14, 2], [14, 15]]) R(x + a, y + b, 1, 1, P.ink); R(x + 8, y + 8, 1, 1, '#f8f8f8'); R(x + 20, y + 7, 1, 1, '#e83a3a'); R(x + 21, y + 9, 1, 1, '#f2d050'); }
function elevator(x, y, open = false) { box(x, y, 20, 8, '#9aa0aa'); R(x + 1, y + 1, 18, 1, '#c8ccd4'); if (open) R(x + 3, y + 2, 14, 6, '#1a1a22'); else { R(x + 3, y + 2, 7, 6, '#b8bcc4'); R(x + 10, y + 2, 7, 6, '#a8acb4'); R(x + 10, y + 2, 1, 6, P.ink); } R(x + 22, y + 2, 2, 3, '#f2c14e'); }
function stairs(x, y, up = true) { box(x, y, 14, 18, '#7a7480'); for (let k = 0; k < 6; k++) R(x + 1, y + 1 + k * 3, 12, 1, up ? shade('#7a7480', 30 - k * 6) : shade('#7a7480', -k * 6)); text(up ? '▲' : '▼', x + 7, y + 5, '#f2c14e', { size: 7, align: 'center' }); }
function sign(x, y, str, col = '#2a2a34', fg = '#f2c14e') { const w = str.length * 5 + 6; box(x - w / 2, y, w, 9, col); text(str, x, y + 1, fg, { size: 7, align: 'center', outline: null }); }

// ------------------------------------------------------------ cars (top-down)
function car(x, y, dir, col, kind = 'sedan') {
  // dir: 'v' (vertical, nose down) or 'h' (horizontal, nose right)
  const L = kind === 'van' ? 36 : kind === 'cruiser' ? 34 : kind === 'bus' ? 70 : 32;
  const Wd = kind === 'bus' ? 20 : 17;
  c.save();
  c.translate(Math.round(x), Math.round(y));
  if (dir === 'h') { c.rotate(-Math.PI / 2); }
  shadow(3, 3, Wd / 2 + 2, L / 2 + 1, 0.3);
  // wheels
  for (const sy of [-L / 2 + 4, L / 2 - 8]) { R(-Wd / 2 - 1, sy, 2, 5, P.ink); R(Wd / 2 - 1, sy, 2, 5, P.ink); }
  box(-Wd / 2, -L / 2, Wd, L, col);
  R(-Wd / 2, -L / 2, 2, L, shade(col, 30)); R(Wd / 2 - 2, -L / 2, 2, L, shade(col, -30));
  if (kind === 'bus') {
    R(-Wd / 2 + 2, -L / 2 + 2, Wd - 4, L - 4, '#e8e0cc');
    for (let k = 0; k < 7; k++) R(-Wd / 2 + 1, -L / 2 + 6 + k * 8, 1, 5, '#4c8aa8'), R(Wd / 2 - 2, -L / 2 + 6 + k * 8, 1, 5, '#4c8aa8');
    R(-4, L / 2 - 6, 8, 3, '#4c8aa8');
    text('1', 0, -4, '#2f6b4f', { size: 7, align: 'center', outline: null });
  } else {
    const glassY = kind === 'van' ? L / 2 - 9 : L / 2 - 10;
    R(-Wd / 2 + 2, glassY, Wd - 4, 4, '#2a4a6a'); R(-Wd / 2 + 3, glassY, 3, 1, '#8cc8e0'); // windscreen (nose down)
    R(-Wd / 2 + 2, -L / 2 + 3, Wd - 4, 3, '#2a4a6a'); // rear window
    R(-Wd / 2 + 2, -L / 2 + 7, Wd - 4, glassY - (-L / 2 + 7), shade(col, 18)); // roof
    if (kind === 'cruiser') { R(-Wd / 2 + 2, -2, Wd - 4, 2, '#2a2a34'); R(-Wd / 2 + 2, -2, (Wd - 4) / 2, 2, Math.sin(time * 10) > 0 ? '#ff3a3a' : '#5a1a1a'); R(0, -2, (Wd - 4) / 2, 2, Math.sin(time * 10) > 0 ? '#2a3a8a' : '#4a7aff'); R(-Wd / 2, -L / 2 + 10, Wd, 2, '#2a3a8a'); }
    R(-Wd / 2 + 1, L / 2 - 1, 3, 1, '#fff6c0'); R(Wd / 2 - 4, L / 2 - 1, 3, 1, '#fff6c0');
    R(-Wd / 2 + 1, -L / 2, 3, 1, '#c83a2a'); R(Wd / 2 - 4, -L / 2, 3, 1, '#c83a2a');
  }
  c.restore();
}

// ------------------------------------------------------------ people (chibi)
const OUT = {
  player: { skin: 1, hair: '#2a1a12', top: '#2a7a8a', legs: '#2a3448', hat: null, scarf: '#e8b83a' },
  cop: { skin: 2, hair: '#1a1a22', top: '#3a6ac8', legs: '#1e2a48', hat: '#1e2a48', badge: true },
  mags: { skin: 0, hair: '#c8c8d0', top: '#c84a6a', legs: '#5a3a5a', apron: '#f2ece0' },
  gang: { skin: 3, hair: '#1a1a1a', top: '#2a2a2a', legs: '#3a3a3a', hat: '#8a2a2a' },
  exec: { skin: 0, hair: '#5a3a1a', top: '#2a2a3a', legs: '#2a2a3a', tie: '#c83a2a' },
  worker: { skin: 2, hair: '#3a2a1a', top: '#e8a02a', legs: '#3a4a6a', hat: '#f2d050' },
  lady: { skin: 1, hair: '#8a3a1a', top: '#6a9a4a', legs: '#4a3a2a' },
  kid: { skin: 0, hair: '#e8c060', top: '#e85a5a', legs: '#2a5aa8' },
  arthur: { skin: 1, hair: '#6a6a6a', top: '#5a3a2a', legs: '#2a2a2a', tie: '#2a5a2a' },
};
function person(x, y, o, { face = 'down', step = 0, gun = false } = {}) {
  x = Math.round(x); y = Math.round(y);
  const s = P.skin[o.skin];
  shadow(x, y, 5, 2, 0.35);
  // legs
  const a = Math.round(Math.sin(step) * 1.5);
  box(x - 3, y - 4 + Math.max(0, a), 2, 3 - Math.max(0, a), o.legs); box(x + 1, y - 4 + Math.max(0, -a), 2, 3 - Math.max(0, -a), o.legs);
  // body
  box(x - 4, y - 10, 8, 6, o.top);
  R(x - 4, y - 10, 8, 1, shade(o.top, 30));
  if (o.apron) R(x - 2, y - 8, 4, 4, o.apron);
  if (o.tie) R(x, y - 9, 1, 4, o.tie);
  if (o.badge) R(x + 1, y - 8, 2, 2, '#f2d050');
  if (o.scarf) R(x - 3, y - 10, 6, 1, o.scarf);
  // arms
  box(x - 6, y - 9, 2, 4, o.top); box(x + 4, y - 9, 2, 4, o.top); R(x - 6, y - 5, 2, 1, s); R(x + 4, y - 5, 2, 1, s);
  if (gun) { box(x + 5, y - 6, 6, 2, '#2a2a30'); }
  // big head
  box(x - 5, y - 19, 10, 9, s);
  R(x - 5, y - 19, 10, 3, o.hair); R(x - 5, y - 16, 2, 2, o.hair); R(x + 3, y - 16, 2, 2, o.hair);
  if (face === 'down') { R(x - 2, y - 14, 1, 2, P.ink); R(x + 2, y - 14, 1, 2, P.ink); R(x - 3, y - 12, 1, 1, '#e8a0a0'); R(x + 3, y - 12, 1, 1, '#e8a0a0'); }

  counter(200, 110, 80, 10, '#2a2a34', '#c8a040'); box(232, 104, 16, 5, '#5ab8e8');
  box(60, 120, 30, 12, '#3a3a44'); R(62, 122, 26, 3, '#5ab8e8'); box(96, 112, 6, 24, '#9aa0aa'); box(120, 112, 6, 24, '#9aa0aa'); // a scanner gate
  // a lounge, plants, the oil-company logo on the floor
  carpet(320, 120, 110, 70, '#7a2a2a'); sofa(330, 130, 36, '#3a3a44'); sofa(380, 166, 36, '#3a3a44'); roundTable(400, 145);
  for (const [x, y] of [[30, 30], [30, 190], [446, 190], [300, 190]]) plant(x, y);
  disc(150, 170, 22, '#c8a040'); disc(150, 170, 18, '#2a2a34'); text('OO', 150, 165, '#c8a040', { size: 9, align: 'center', outline: null });

}

// ------------------------------------------------------------ scenes, drawing loop
const SCENES = {
  street: { name: 'The street', cap: 'Halvermouth at the crossroads by day: roofless buildings you see straight into, kerbs with a lip, dashed lines, long lamp shadows, a cruiser with its lights on, chibi people.', draw: sceneStreet },
  bar: { name: 'Night: the Abacus', cap: 'Lighting: the night is a dark wash with pools of lamp and neon light cut out of it — the same trick for every interior and street lamp.', draw: sceneBar },
  lobby: { name: 'Tower: ground floor', cap: 'Inside Ober\'s Oil Tower at street level: its lobby is just another roofless room. The lifts and stairs lead up — each floor is its own level, drawn over the city below.', draw: sceneLobby },
  floor14: { name: 'Tower: floor 14', cap: 'Upstairs, the floor plate floats over the city: the street far below (the same art, shrunk and hazed, drifting as you move), the facade falling away under the south edge, clouds passing between.', draw: () => sceneTower(14) },
  roof: { name: 'Tower: the roof', cap: 'The roof: helipad, plant, the antenna — and the city even further down.', draw: () => sceneTower('roof') },
};
let scene = new URLSearchParams(location.search).get('scene') || 'street';
const nav = document.getElementById('nav');
for (const [id, s] of Object.entries(SCENES)) { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { scene = id; render(); }; b.dataset.id = id; nav.append(b); }
function render() {
  // route every primitive through the current context
  c.setTransform(1, 0, 0, 1, 0, 0);
  R(0, 0, W, H, '#000');
  SCENES[scene].draw();
  sc.imageSmoothingEnabled = false;
  sc.drawImage(low, 0, 0, 1920, 1080);
  document.getElementById('cap').textContent = SCENES[scene].cap;
  for (const b of nav.children) b.className = b.dataset.id === scene ? 'on' : '';
}
function loop(t) { time = t / 1000; render(); requestAnimationFrame(loop); }
if (new URLSearchParams(location.search).get('still')) { time = 1.3; render(); window.__ready = true; } else requestAnimationFrame(loop);
</script>
